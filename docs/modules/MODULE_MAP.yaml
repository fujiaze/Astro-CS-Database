    plugin_doc: docs/plugins/algorithms_phase1/01_calibration.md
    target_dir: lib/algorithms/calibration
    readme: lib/algorithms/calibration/README.md
    module_yaml: lib/algorithms/calibration/module.yaml
    target: astrocs_p1_calibration
    target_file: lib/algorithms/calibration/CMakeLists.txt
    co_located_tests: lib/algorithms/calibration/tests
    module_id: astrocs.p1.calibration
    module_version: 0.11.0-alpha.2
    abi_version: 1
    entrypoint: astrocs_module_query_v1
    entrypoint_kind: c-abi
    data_contracts: [DATA-P1-CAL]
    data_contracts_source: lib/algorithms/calibration/module.yaml（声明面，观察值）
    schema_links: [eng/contracts/schemas/data_light.schema.json, eng/contracts/schemas/calibration_output.schema.json]
    schema_links_source: docs/plugins/algorithms_phase1/01_calibration.md §3
    schema_link_globs: []
    product_manifest:
      required: true
      match_module_id: astrocs.p1.calibration
      match_unit_id: null
      expected_unit_ids: []
      unit_kind: module
      exemption_reason: null
    legacy_paths: [lib/calibration]
    note: 源 = lib/calibration（ARCH-001 已迁入 target_dir；不动点=迁移 map 条目 18）。
