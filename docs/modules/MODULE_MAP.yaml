# ===========================================================================
# 声明路径缺失登记（缺口，逐条；FIX-404 收口 v2 / 2026-09-21）
# ---------------------------------------------------------------------------
# 本表是**期望映射**：下列声明指向的路径/target **当前在树中不存在**（实测
# os.path.exists=false / 全仓 CMake 无 add_library(target)）。此处**如实登记为缺口**，
# 不得读作「该路径已存在」；实现只认 target_dir 下的真实生产源，缺口不参与实现/安装判定。
#
# 硬规则（FIX-404 / GAP_AUDIT G3-8/G1-5；禁止删条目粉饰）：
#   * 声明缺失 ⇒ 必须在本表逐条登记 owner；**不得**为过门删除声明；
#   * 文件已移动的 ⇒ 直接更新声明路径、不登记缺口（FIX-404 已按实测更新 drizzle /
#     platesolve / hips_browser 的 co_located_tests 三条）；
#   * owner 必须命中下方 gap_owners；kind=task 的 owner 必须有对应任务书文件，
#     否则机器判红（fail-closed）。
# 校验：python3 eng/tools/quality/check_module_map.py
#   * 声明缺失且**未登记** ⇒ FAIL(fake_path)；
#   * 登记缺口的路径/target **已存在/已定义** ⇒ FAIL(stale_declared_absent)；
#   * owner 未登记 / 任务书缺失 ⇒ FAIL(gap_owner_unknown)；
#   * 已登记缺口 ⇒ GAP（逐条出机器表并计数，不静默、不判绿）。
# 规模：路径缺口 50 条（G3-8 实测 53 条 − 3 条按移动后真实路径更新）+ target 缺口 16 条
#       （「声明↔文件↔CMake target↔产品清单」四方一致的 CMake target 腿）。
# ===========================================================================
