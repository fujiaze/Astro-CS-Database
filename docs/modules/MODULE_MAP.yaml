# AstroCS 模块一致性映射表（MOD-001 / CHK-MODULE-MANIFEST）
#
# 用途：把 docs/plugins/ 23 篇插件规范与代码落位八元组建立一一机器映射：
#   模块 ID → 目标目录 → README → module.yaml（ID/版本/ABI/端口/schema 链接/entrypoint）
#           → 公开头 → CMake target → 产品清单条目 → 共址测试
#
# 权威依据：
#   - docs/plugins/00_INDEX.md §1（模块归属）、§2（23 篇模块总表）、§3（每篇 8 节模板）、§5（维护规则）
#   - ENGINEERING_SPEC.md §4（每模块必备 7 项）、§8（manifest/注册表/target/产品清单一致）
#   - ASTROCS_DESIGN.md §7.1（顶层结构唯一）、§7.3（模块与 DLL/SO 边界）、§11.3（状态阶梯唯一口径）
#   - docs/ci/01_CHECKS.md §2（CHK-MODULE-MANIFEST = 模块 manifest/注册表/构建 target/产品清单一致，P0）
#   - contracts/config/module_dll_contract.schema.json（entrypoint_abi 统一 astrocs_module_query_v1）
#
# 本表是**期望映射**：不含任何模块状态声明。模块状态一律由
# tools/quality/check_module_map.py 现场计算，状态词只取 §11.3 词表；
# 禁止在本表写 status 字段（防「表内自证绿」）。
#
# 诚实性约定：legacy_paths 保存**迁移前**的旧路径（历史键），只作 ARCH-001 的定位线索，
# **不参与实现/安装判定**；实现只认 target_dir 下的生产源。因迁移已完成，旧路径在树中
# 一律不存在（清单与逐条映射见 cmake/ARCH-001-migration-manifest.md §1，MOD-002 已核对
# 23/23 条）。禁止把 target_dir 自身或其子路径写进 legacy_paths——否则「legacy 存在」
# 这类 NOTE 会被自身目录触发，把历史键退化成自证。
#
# 维护：本表随 DATA-001（合同/schema 面）与 ARCH-001/INT-001（目录迁移/装配）更新；
# 修改本表必须同时过 CHK-MODULE-MANIFEST（MOD-002 迁移后引用刷新，2026-09-16）。

schema_version: 1
tool: tools/quality/check_module_map.py
authorities:
  module_index: docs/plugins/00_INDEX.md §1/§2/§3/§5
  engineering_spec: ENGINEERING_SPEC.md §4/§8
  design: ASTROCS_DESIGN.md §7.1/§7.3/§11.3
  checks_registry: docs/ci/01_CHECKS.md §2
status_vocabulary: [CONTRACT_READY, IMPLEMENTED, INSTALLED, VERIFIED, NOT_IMPLEMENTED, NOT_VERIFIED, DEFERRED, DORMANT, FAIL]
status_vocabulary_authority: ASTROCS_DESIGN.md §11.3
conventions:
  target_dir_algorithms: lib/algorithms/<id>
  target_dir_infrastructure: lib/infrastructure/<id>
  target_algorithms: astrocs_<scope>_<id>
  target_infrastructure: astrocs_infra_<id>（cli 为唯一入口 exe，target=astrocs）
  abi_entrypoint: astrocs_module_query_v1
  abi_entrypoint_authority: contracts/config/module_dll_contract.schema.json（entrypoint_abi const）
  public_header_glob: include/**/*.h
  public_header_requirements: [abi_version_or_struct_size]
  co_located_tests_glob: tests/**/*
  module_yaml_required_keys: [id, module_id, module_version, abi_version, entrypoint, input_ports, output_ports, data_contracts]
  product_manifest_file: packaging/astrocs.product.json
  contract_index_file: docs/contracts/INDEX.yaml
  schema_dir: contracts/schemas
modules:
  - id: calibration
    scope: phase1
    group: algorithms
    plugin_doc: docs/plugins/algorithms_phase1/01_calibration.md
    target_dir: lib/algorithms/calibration
    readme: lib/algorithms/calibration/README.md
    module_yaml: lib/algorithms/calibration/module.yaml
    target: astrocs_p1_calibration
    target_file: lib/algorithms/calibration/CMakeLists.txt
    co_located_tests: lib/algorithms/calibration/tests
    module_id: astrocs.p1.calibration
    module_version: 0.11.0-alpha.2
    abi_version: 1
    entrypoint: astrocs_module_query_v1
    entrypoint_kind: c-abi
    data_contracts: [DATA-P1-CAL]
    data_contracts_source: lib/algorithms/calibration/module.yaml（legacy 声明面，观察值）
    schema_links: [contracts/schemas/data_light.schema.json, contracts/schemas/calibration_output.schema.json]
    schema_links_source: docs/plugins/algorithms_phase1/01_calibration.md §3
    schema_link_globs: []
    product_manifest:
      required: true
      match_module_id: astrocs.p1.calibration
      match_unit_id: null
      expected_unit_ids: []
      unit_kind: module
      exemption_reason: null
    legacy_paths: [lib/calibration]
    note: legacy 源 = lib/calibration（ARCH-001 已迁入 target_dir；不动点=迁移 map 条目 18）。
