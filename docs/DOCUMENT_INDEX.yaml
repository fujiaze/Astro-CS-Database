# ACSD 文档机器索引（DOCUMENT_INDEX）——全文档集唯一索引地图
#
# 依据：docs/ACSD_DESIGN.md §0（文档权威与索引）、§0.1（文档写法）
#
# 字段：
#   path        文档路径（相对仓库根；必须真实存在，悬空条目即缺陷）
#   status      文档活动分类 ∈ {ACTIVE_NORMATIVE, ACTIVE_INFORMATIVE, GENERATED,
#               ARCHIVED_NON_NORMATIVE}；不是 §12.5 的交付状态阶梯
#   duty        职责一句话（本文档承担什么）
#   upstream    上游条款（本文档落实的 docs/ACSD_DESIGN.md 条款，与文档抬头「上游」区同源）
#   downstream  下游被引用处（机器扫描出的活动引用方）
#   notes       （可选）当下生效的口径补充：唯一正本指认、字段取值域、生成与再生成纪律；
#               不写日期、任务号、轮次、沿革与出处
#
# 规则：
#   1. path 全索引唯一，不跨区段重复；active 区段不含任何 archive 路径，archived 区段全部 ARCHIVED_NON_NORMATIVE；
#   2. 每份下级文档（docs/**/*.md）在 active 区段登记且抬头有「上游」条款区；目录招牌件（各目录
#      README.md）按「每目录必有 README」治理，不进规范索引面；本索引自身以条目登记；
#   3. 本文件是唯一索引地图，不用 README 合集代替；悬空指针（含代码注释里的 docs/ 路径）按缺陷处置，
#      跨域未修项随对应治理任务登记；
#   4. 覆盖 = docs/** 全部 .md 与 .yaml + 仓库根固定条目（AGENTS.md、README.md、VERSION、
#      ACSD_DESIGN.md 本体与本索引）；
#   5. docs 一层只保留最高设计、本索引、术语表、入口 README 与 science/、engineering/、detail/
#      三个文件夹；机器源与台账不进 docs，落在 eng/contracts/ 与 artifacts/evidence/。
#   6. 豁免（覆盖面的越界登记）：落在规则 4 覆盖面之外的条目必须逐条在 notes 写明豁免理由，
#      无 notes 豁免说明的越界条目即缺陷。机器源（.json/.csv/.py 等非人读件）一律不登记 ——
#      规则 4 的覆盖面以人读件为界，机器源由其人读正本承载。
#
# 扫描口径（downstream）：git 跟踪文件，排除 artifacts/、run/、build/、lib/third_party/、
#   实验/、logs/ 等过程与证据目录。
#
# 现态：机器门禁面退场后本索引已剔除全部指向已删除测试/预言机/自检件的 downstream 名；
#   因「等 N 处」计数随删除失效，本轮一并丢弃这些计数后缀。该计数须由前台按现行扫描口径
#   整体重算后回填，不得凭本轮删除量反推。
#
doc_index:
  schema_rev: "3"
  coverage: "docs/** 全部 .md 与 .yaml + 仓库根固定条目（AGENTS.md、README.md、VERSION）；目录招牌件按「每目录必有 README」治理，不进规范索引面。覆盖面以人读件为界：机器源（.json/.csv/.py 等）不因跨域而自动取得登记资格；跨域件按 docs/engineering/DOCUMENT_GOVERNANCE.md 规则 6 以 notes 具名豁免登记，当前豁免 4 条（跨域人读件 2 条：实验/裁决台账.md、artifacts/evidence/known-limitations-ledger/LIMITATIONS.md；人读正本直接依赖的判据实现 2 条：eng/contracts/ledgers/ledger_schema.py、eng/tools/source_scan.py）"
