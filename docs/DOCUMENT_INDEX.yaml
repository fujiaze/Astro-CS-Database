# ACSD 文档机器索引（DOCUMENT_INDEX）——全文档集唯一索引地图
#
# 依据：docs/ACSD_DESIGN.md §0（文档权威与索引）、§0.1（文档写法）
#
# 字段：
#   path        文档路径（相对仓库根；必须真实存在，悬空条目即缺陷）
#   status      文档活动分类 ∈ {ACTIVE_NORMATIVE, ACTIVE_INFORMATIVE, GENERATED,
#               ARCHIVED_NON_NORMATIVE}；不是 §12.5 的交付状态阶梯
#   duty        职责一句话（本文档承担什么）
#   upstream    上游条款（本文档落实的 docs/ACSD_DESIGN.md 条款，与文档抬头「上游」区同源）
#   downstream  下游被引用处（机器扫描出的活动引用方）
#   notes       （可选）当下生效的口径补充：唯一正本指认、字段取值域、生成与再生成纪律；
#               不写日期、任务号、轮次、沿革与出处
#
# 规则：
#   1. path 全索引唯一，不跨区段重复；active 区段不含任何 archive 路径，archived 区段全部 ARCHIVED_NON_NORMATIVE；
#   2. 每份下级文档（docs/**/*.md）在 active 区段登记且抬头有「上游」条款区；目录招牌件（各目录
#      README.md）按「每目录必有 README」治理，不进规范索引面；本索引自身以条目登记；
#   3. 本文件是唯一索引地图，不用 README 合集代替；悬空指针（含代码注释里的 docs/ 路径）按缺陷处置，
#      跨域未修项随对应治理任务登记；
#   4. 覆盖 = docs/** 全部 .md 与 .yaml + 仓库根固定条目（AGENTS.md、README.md、VERSION、
#      ACSD_DESIGN.md 本体与本索引）；
#   5. docs 一层只保留最高设计、本索引、术语表、入口 README 与 science/、engineering/、detail/
#      三个文件夹；机器源与台账不进 docs，落在 eng/contracts/ 与 artifacts/evidence/。
#   6. 豁免（覆盖面的越界登记）：落在规则 4 覆盖面之外的条目必须逐条在 notes 写明豁免理由，
#      无 notes 豁免说明的越界条目即缺陷。机器源（.json/.csv/.py 等非人读件）一律不登记 ——
#      规则 4 的覆盖面以人读件为界，机器源由其人读正本承载。
#
# 扫描口径（downstream）：git 跟踪文件，排除 artifacts/、run/、build/、lib/third_party/、
#   实验/、logs/ 等过程与证据目录。
#
# 现态：机器门禁面退场后本索引已剔除全部指向已删除测试/预言机/自检件的 downstream 名；
#   因「等 N 处」计数随删除失效，本轮一并丢弃这些计数后缀。该计数须由前台按现行扫描口径
#   整体重算后回填，不得凭本轮删除量反推。
#
doc_index:
  schema_rev: "3"
  coverage: "docs/** 全部 .md 与 .yaml + 仓库根固定条目（AGENTS.md、README.md、VERSION）；目录招牌件按「每目录必有 README」治理，不进规范索引面。覆盖面以人读件为界：机器源（.json/.csv/.py 等）不因跨域而自动取得登记资格；跨域件按 docs/engineering/governance/DOCUMENT_GOVERNANCE.md 的跨域豁免登记条款 以 notes 具名豁免登记，当前豁免 4 条（跨域人读件 2 条：实验/裁决台账.md、artifacts/evidence/known-limitations-ledger/LIMITATIONS.md；人读正本直接依赖的判据实现 2 条：eng/contracts/ledgers/ledger_schema.py、eng/tools/source_scan.py）"
  active:
    - path: "实验/裁决台账.md"
      status: ACTIVE_NORMATIVE
      duty: "跨单元裁决台账：五个创新点实验重做的分歧终裁，含依据与落点正本节"
      upstream: "docs/ACSD_DESIGN.md §12.1（科学正确性与三重佐证）"
      notes: 豁免登记（规则 6）：落在 docs/** 之外，实验域的分歧终裁面，属 ACSD_DESIGN §12.1 直接点名的终裁载体，不因跨域而免于索引
    - path: "eng/contracts/ledgers/ledger_schema.py"
      status: ACTIVE_NORMATIVE
      duty: 合同台账的 schema 校验与加载（fail-closed）
      upstream: "docs/engineering/contracts/CONFIG.md"
      notes: 豁免登记（规则 6）：落在 docs/** 之外且为代码，配置合同明定的台账 schema 载体；登记它是为了让配置正本的反向指针可达
    - path: "eng/tools/source_scan.py"
      status: ACTIVE_NORMATIVE
      duty: 源码扫描工具：注释剥离与源文件遍历
      upstream: "docs/engineering/governance/DOCUMENT_GOVERNANCE.md"
      notes: 豁免登记（规则 6）：落在 docs/** 之外且为代码，是文档治理规范的写法纪律所依赖的扫描实现；索引指向它是纪律—实现的反向指针
    - path: "docs/science/calibration/CCD_DEFECT.md"
      status: ACTIVE_NORMATIVE
      duty: "CCD/CMOS 线性缺陷的分类、检测判据、插值修复的方差处置与一手文献证据（坏列、CTE 拖尾、宇宙线、卫星线）"
      upstream: "docs/ACSD_DESIGN.md §4.2（normalize 节点流程）、§12.1（科学正确性与三重佐证）"
      notes: "由原 CCD_LINEAR_DEFECT_LITERATURE 迁入并与 CALIBRATION 的缺陷可分性条款合并重写；唯一正本。参考文献逐条登记核验状态。κ=2 的依据是非重复计数的记账约定而非信息论下界；坏列七步判据无复跑脚本，§3.1 读数登记为历史读数"
