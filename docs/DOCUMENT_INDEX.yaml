      duty: 源码扫描工具：注释剥离与源文件遍历
      upstream: "docs/engineering/governance/DOCUMENT_GOVERNANCE.md"
      notes: 豁免登记（规则 6）：落在 docs/** 之外且为代码，是文档治理规范的写法纪律所依赖的扫描实现；索引指向它是纪律—实现的反向指针
