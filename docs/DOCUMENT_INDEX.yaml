      upstream: "docs/ACSD_DESIGN.md §12.1（科学正确性与三重佐证）"
      notes: 豁免登记（规则 6）：落在 docs/** 之外，实验域的分歧终裁面，属 ACSD_DESIGN §12.1 直接点名的终裁载体，不因跨域而免于索引
    - path: "docs/engineering/WINDOWS_BUILD_NODE.md"
