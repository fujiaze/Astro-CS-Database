# AstroCS 文档机器索引（DOCUMENT_INDEX）——全文档集唯一索引地图
#
# 依据：ASTROCS_DESIGN.md §0.2（详细文档层与双向索引）、ENGINEERING_SPEC.md §8（文档集）
# 重写：DOC-403（2026-09-21，基线 HEAD d1ccfa1bed9c）——双向层级索引闭合
# 校验：python3 eng/tools/doccheck/check_doc_index.py --strict（exit 0 = PASS；含 --self-test）
#
# 字段：
#   path        文档路径（相对仓库根；必须真实存在——悬空条目即缺陷，检查器判红）
#   status      文档活动分类 ∈ {ACTIVE_NORMATIVE, ACTIVE_INFORMATIVE, GENERATED,
#               ARCHIVED_NON_NORMATIVE}，由检查器现场校验；**不是** §12.5 交付状态阶梯
#   duty        职责一句话（本文档承担什么）
#   upstream    上游条款（本文档落实的 ASTROCS_DESIGN.md 条款；与文档抬头「上游」区同源）
#   downstream  下游被引用处（机器扫描出的活动引用方；扫描面见下方「扫描口径」）
#   notes       （可选）冻结/裁决/生成来源等不可丢的登记
#
# 规则：
#   1. path 全索引唯一，不跨区段重复；active 区段不含任何 archive 路径；
#      archived 区段全部 ARCHIVED_NON_NORMATIVE；
#   2. 每份下级文档（docs/**/*.md）必须在 active 区段登记，且抬头有「上游」条款区
#      （覆盖率 100%，机器判红）；最高设计与根文档的每个 docs/ 指针必须可达；
#   3. 活动设计档案（按条款 (d) 保留，照实登记在 active 区段，不当作归档）：
#      docs/validation/v6/**（QA 矩阵）；
#   4. CLEAN-402 删除 docs/{archive,review,backlog}/** 后遗留的 32 条悬空条目
#      （archived 区段 30 条 docs/archive/** + active 区段 2 条 docs/review、
#      docs/backlog/NEXT_STAGE.md）已在本版清除；被删内容由 git 历史承载；
#   5. 本文件是唯一索引地图：不用 README 合集代替；悬空指针（含代码注释里的
#      docs/ 路径）由 doc-index 门拦截。
#
# 扫描口径（downstream）：git 跟踪文件，排除 问题扫描/、reports/、artifacts/、run/、
#   build/、lib/third_party/、实验/、工程控制/、logs/ 等过程与证据目录。
#   （2026-09-21 ROOT-CONSOLIDATION：reverse_verify/ 根条目解散、内容迁入 实验/，
#     排除面等量替换，扫描面不增不减。）

