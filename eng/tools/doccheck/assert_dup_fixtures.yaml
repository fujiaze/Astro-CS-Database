  - id: NEG-04
    kind: negative
    title: 已知漏检——斜杠两侧的空格让逐字匹配整行不可见
    query: ["--text", "SNR = F_ref/σ_F"]
    verified_by: me
    known_miss: true
    expect:
      known_miss:
        - "docs/science/unified/UNIFIED_SCIENCE_MODEL.md:91"    # 实际写作 "SNR = F_ref / σ_F"（斜杠两侧有空格）
      note: >-
        **本项目实测过的限制，记为 known_miss。** 该行实际内容是
        `SNR = F_ref / σ_F ,        σ_F = sqrt( Var(F̂) ) = 1 / sqrt(W)`——斜杠前后各有一个空格。
        查询串用的是无空格写法 `SNR = F_ref/σ_F`，因此整行对逐字匹配不可见。
        实测 --text "SNR = F_ref/σ_F" 共 13 命中 / 11 文件 / 6 层，**其中不含 UNIFIED_SCIENCE_MODEL.md:91**；
        我另外 grep 该文件确认原文确实是带空格写法，grep「无空格版」在 docs/ 树下 0 命中。
        ⇒ 记为 known_miss 而非工具缺陷：--text 零歧义，代价是对空格 / 全半角 / 连字零容错。
        附带一条口径观察：本查询 13 处命中的 matched 全都等于查询串本身，所以归一后形态只有 1 种，
        工具必然把全部命中贴成「重复副本·逐字一致」。这不是初判失灵，是**逐字匹配的结构性必然**——
        它按定义看不见任何书写分叉。--text 的初判在原理上不可能给出别的结论，读表时别把它当独立信息。
        同族的其他不可见点（本次一并核实，均不在 13 命中里）：
          docs/science/CONTROL_WEIGHT_SNR.md 的 `SNR_c = F_ref/σ_F,c`（带下标后缀 ,c）
          docs/detail/UNIFIED_MODEL.md 的 `w=SNR²/F_ref²=1/σ_F²`（无空格写法，行内自注）
        ⇒ 「命中 13 处」**不等于**「全仓 13 处写了这条式」。这条限制必须在每次引用命中数时同写。
        known_miss 字段的语义：若该位置**将来**出现在命中里，测量脚本报 FAIL，
        提醒把这条已登记的限制撤掉——已消失的限制比新出现的限制更值得知道。

  - id: NEG-05
    kind: negative
    title: 同前缀吸进无关同量级读数（--num 的固有误报面，已登记、预期内）
    query: ["--num", "1.739917768184329"]
    verified_by: me
    expect:
      known_false_positive:
        - "eng/tests/validation/release02/q1_photometry_gradient/real_data2.json:17475"  # 1.739334435688303
        - "实验/engineering-evidence/compress-01/acc_roundtrip.json:5970"              # 1.738530001603067
        - "实验/engineering-evidence/compress-01/acc_roundtrip.json:5972"              # 1.7389279964845628
      note: >-
        这三处是「同前缀·疑似旧值」规则吸进来的**真误报**（人判）：分别是光度梯度实测读数与
        压缩编解码往返精度读数，与 Moffat4 的 FWHM/σ_g 因子毫无关系，只是都落在 1.73x 量级、
        与 1.739917768184329 的有效数字公共前缀够长。它们与 POS-06 的真命中
        （defaults.json:91 锁旧值 1.7399178387）混在同一次输出里，单看命中列表分不出真假。
        ⇒ 量出 --num 的误报面：本次实测该查询 19 命中（排除夹具自身自污染后），其中 3 处真误报。
        这印证工具 banner 的自述「--num 尤其易误报」不是套话。
        **为什么用 known_false_positive 而不是 must_not_hit**：must_not_hit 的语义是
        「出现即护栏失守、判 FAIL」。而本条登记的正是「工具确实会误报、且我们已知道」这一事实——
        用 must_not_hit 会让这条夹具永远红，红的却是文档而不是工具行为。
        known_false_positive 计入负例误报率（那是实测数），但不判 FAIL。
        这也是为什么 must_hit 与各类误报登记必须都由人读原文判定：工具给不出真假标签。

