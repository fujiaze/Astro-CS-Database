# 断言副本检测器 · 实测夹具集
#
# 用途：给 eng/tools/doccheck/check_assert_dup.py 的四种查询模式建一批带人工期望的夹具，
#       由 measure_assert_dup_accuracy.py 实跑并打出逐条 PASS/FAIL 表。
#
# 【纪律】
#   · 本文件只写**期望**，不写工具行为。期望值一律由人读原文判定，不由工具反推。
#   · 每条 must_hit 的 file:line 都来自本文件末尾「核验记录」一节列出的实跑命令输出。
#   · verified_by: me     = 本次由我（执行夹具的 agent）亲自 grep / 实跑复核过
#     verified_by: 待核    = 尚未独立复核，使用前请自行核
#   · 计数只作分母。PASS/FAIL 是给人看的诊断，不是门禁；退出码恒 0。
#
# 【字段】
#   kind: positive      仓内确有该形态，期望工具抓到
#         negative      仓内确无 / 或命中后经人读判定为非矛盾
#   query / queries     单条查询，或多条子查询（并集判定；报告里会标明每条 must_hit 由哪条子查询命中）
#   expect.must_hit     必须出现在命中列表里的 file:line
#   expect.must_hit_layer  可选，断言该 file:line 被工具归到哪一层（人工判定）
#   expect.must_not_hit 不得出现；出现即误报
#   expect.forbid_matched  不得作为「命中值」出现的字面量（量级护栏等）
#   expect.forbid_verdicts 不得被工具贴上的初判标签（防把非矛盾判成重复副本）
#   expect.expect_zero_hits  整条查询期望 0 命中
#   expect.known_miss   已知漏检位置：人读确认该处确有该断言，但工具抓不到
#   expect.human_ruling 人读裁决（命中是否构成矛盾）
#   expect.note         复核时看到的东西

meta:
  目标工具: eng/tools/doccheck/check_assert_dup.py
  测量脚本: eng/tools/doccheck/measure_assert_dup_accuracy.py
  仓根: "."
  工具退出码约定: 恒为 0（发现分歧不是错误）
  本夹具集性质: 诊断表，不是门禁；计数只作分母，判定由人阅读上下文做出

