  # ── 负例 ────────────────────────────────────────────────────────────────
  - id: NEG-01
    kind: negative
    title: 量级护栏——不得把 1000 倍不同的值吸成精度变体
    query: ["--num", "1.482602218505602"]
    verified_by: me
    expect:
      must_not_hit:
        - "实验/engineering-evidence/l2_performance/gates/real4_w16_gate.json:4066"  # "cpu_percent": 1482.63
        - "docs/science/algorithms/PHASE2_SAMPLER.md:78"                            # 实测 σ_bg 中位 = 14.826 ADU/px
        - "实验/absolute-snr/docs/f-instr-canon.md:245"                             # 表内 14.826
        - "实验/absolute-snr/docs/f-instr-canon.md:246"                             # 表内 14.826
      forbid_matched:
        - "1482.63"
        - "14.826"
      note: >-
        这三个位置**仓内确有** 1482.63 / 14.826（不是空想出来的护栏），我先 grep 到再登记的。
        实测 --num 1.482602218505602 的 205 处命中，matched 值只有 7 档
        （1.4826 / 1.482602 / 1.4826022 / 1.4826022185 / 1.483 / 1.4826022185056023 / 1.4826022185056019），
        不含 1482.63 或 14.826。量级护栏成立。
        机理：1482.63 与 1.4826 的有效数字公共前缀有 5 位、且公共前缀只越过候选数整数部 1 位
        （past_int = 5 − 4 = 1 < 2），第 1 条规则被挡住；第 2 条规则的 rel_diff ≈ 999 远超 tol=1e-3。
        14.826 的 past_int = 5 − 2 = 3 ≥ 2 过了第一关，但 rel_diff ≈ 9.0 > 0.5 仍被挡。
        ⇒ 护栏是两条规则叠加的结果，单看任何一条都不够。

  - id: NEG-02
    kind: negative
    title: 命中 ≠ 矛盾——211034.6 是故意写的反例
    query: ["--num", "211076.28514206142"]
    verified_by: me
    expect:
      must_hit:
        - "docs/science/algorithms/DRIZZLE_GEOMETRY.md:169"    # 命中是预期的；但人读 = 反例示范
        - "docs/science/algorithms/DRIZZLE_GEOMETRY.md:167"
        - "docs/science/DISPUTE_RESOLUTION.md:204"
      forbid_verdicts:
        - "重复副本·逐字一致"
        - "同名不同义·候选"
      human_ruling: >-
        全部 44 处命中经人读判定**均非矛盾**。211034.6 是 HEALPIX 尺度常数的**禁抄旧值**，
        仓内留着它全部是为了说明「抄错值会怎样」：
        DRIZZLE_GEOMETRY.md:167/:169 在「数值纪律」里说清了后果——若 finest 落在
        (211034.6/2^k, 211076.285/2^k) 窗口内就**少取一阶** nside；
        DISPUTE_RESOLUTION.md:204 的终裁原文是「`211034.6` **不得使用**」。
        其余 211076.3 类命中是同一常数的 7 位截断（真实代码注释），相对差 1.9e-05，是精度变体不是旧值。
      note: >-
        本条专门用来量「上下文够不够人一眼看出是反例」。实测结论：**大部分够，1 处不够。**
        够的——DISPUTE_RESOLUTION.md:204 excerpt 直接含「不得使用」四字，一眼可判；
          DRIZZLE_GEOMETRY.md:169 excerpt 含「窗口内**少取一阶**」，反例信号明确。
        不够的——DRIZZLE_GEOMETRY.md:167 的 excerpt 被 clip 成
          「**数值纪律**：常数按上式**求值**，取值来源 = 求值结果；`211034.6` 与上式相差」
          句子在下一行才说完，单独看这一行读不出「反例」，必须连读 :167–:169。
        ⇒ 工具的 excerpt 是**单行 clip（宽 110）**，跨行论证会被腰斩。这是本仓实测出的可改进点，
        报给工具作者；本脚本不改工具。
        另外 forbid_verdicts 断言工具没有把 num 命中误贴成「重复副本·逐字一致」或「同名不同义·候选」——
        实测全部 44 处初判都是「数值分歧·需人裁」，符合工具自述的保守口径。

