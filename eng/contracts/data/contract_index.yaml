# ── DATA 旧合同 ID → 统一对象 canonical 映射（DATA-001；判定见 unified_object_registry.json#legacy_contract_ids）──
legacy_contract_id_map:
  - legacy_id: DATA-P1-CAL
    decision: mapped
    canonical_objects: [signal]
    relation: single_object
    canonical_schema_files: [eng/contracts/schemas/unified/signal.schema.json]
  - legacy_id: DATA-P1-COS
    decision: mapped
    canonical_objects: [signal]
    relation: single_object
    canonical_schema_files: [eng/contracts/schemas/unified/signal.schema.json]
  - legacy_id: DATA-P1-COSMETIC
    decision: mapped
    canonical_objects: [signal]
    relation: superseded_placeholder
    canonical_schema_files: [eng/contracts/schemas/unified/signal.schema.json]
  - legacy_id: DATA-P1-DRZ
    decision: mapped
    canonical_objects: [signal, variance, ivar, support, coverage]
    relation: composite
    canonical_schema_files: [eng/contracts/schemas/unified/signal.schema.json, eng/contracts/schemas/unified/variance.schema.json, eng/contracts/schemas/unified/ivar.schema.json, eng/contracts/schemas/unified/support.schema.json, eng/contracts/schemas/unified/coverage.schema.json]
  - legacy_id: DATA-P1-SOURCES
    decision: no_canonical
    canonical_objects: []
    relation: orchestration_port_catalog_name
    canonical_schema_files: []
  - legacy_id: DATA-P2-SMP
    decision: no_canonical
    canonical_objects: []
    relation: module_io_contract_without_object_semantics
    canonical_schema_files: []
  - legacy_id: DATA-GAIA-001
    decision: no_canonical
    canonical_objects: []
    relation: external_catalog_service_contract
    canonical_schema_files: []
  # 判定 rule 与逐条证据: eng/contracts/data/unified_object_registry.json#legacy_contract_ids
