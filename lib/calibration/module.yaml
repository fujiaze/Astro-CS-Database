# AstroCS phase1 calibration module — 元数据 (P1-CAL-DOC 冻结, 2026-09-07)
# 状态: CONTRACT_READY —— 实现存在（lib/calibration，CMake astrocs_calibration），
# 模块化迁移已由 P1-CAL-IMPL 交付：astrocs_p1_calibration DLL（C ABI v1 九操作
# adapter，entrypoint astrocs_module_query_v1，唯一导出 ABI-006；plan-execute-
# cancel-inspect / host_executor_lease 租约接线见 lib/calibration/CMakeLists.txt
# 与 src/module_entry.cpp）。可执行测试由 P1-CAL-TEST 建立（TEST-P1-CAL-001）。
# 字段遵循 11_MODULE_SOURCE_TEST_STANDARD.md §4；source_symbols 为源码
# 核对清单（P1-CAL-DOC，2026-09-07，12 个 AC_API 科学/工具导出），
# 禁止手抄他版。
# threading_model=host_executor_lease 为迁移目标合同值（11 号标准 §4 值域）；
# adapter 经 host executor acquire/release 租约 + ac_set_num_threads 注入
# OMP ICV（不改生产源；见 docs/contracts/PUBLIC_API.md API-CAL-001 与
# ALG-CAL §6/§10）。
id: MOD-astrocs-phase1-calibration
module_id: astrocs.p1.calibration
module_version: 0.11.0-alpha.2
abi_version: 1
phase_scope: phase1
dll_name: astrocs_p1_calibration.dll
module_status: CONTRACT_READY
entrypoint: astrocs_module_query_v1
# node_operations 按 types.h op 词表登记 (每 (module_id, operation) 绑定同一
# 唯一 entry astrocs_module_query_v1; gaia INT 先例)。10 科学 op 与 legacy
# AC_API 科学导出 1:1 (ac_set_num_threads/ac_version 为工具通道不进 op 面);
# 线程改经 host_executor_lease 租约注入 (ac_set_num_threads 仅作注入途径)。
node_operations:
  - calibrate_frame
  - calibrate_frame_f64
  - correct_frame
  - correct_frame_f64
  - generate_master_bias
  - generate_master_dark
  - generate_master_flat
  - generate_master_bias_f64
  - generate_master_dark_f64
  - generate_master_flat_f64
# input/output 端口名与 lib/calibration/integration/astrocs_p1_calibration.integration.json
# typed_ports 段逐一同名 (P1-CAL-INT 注册面修正; gaia INT 先例)。
# p1.master_dark/p1.master_bias/p1.master_flat 为可选输入端口 (manifest 键
# 缺席 = legacy NULL 恒等通道, DEV-2 行为保持, P1-CAL-IMPL 已登记)。
input_ports:
  - p1.frames
  - p1.master_dark
  - p1.master_bias
  - p1.master_flat
output_ports:
  - p1.calibrated
science_contracts:
  - SCI-CAL-001
algorithm_contracts:
  - ALG-CAL-001
  - ALG-CAL-002
  - ALG-CAL-003
  - ALG-CAL-004
  - ALG-CAL-005
  - ALG-CAL-006
data_contracts:
  - DATA-P1-CAL
api_contracts:
  - API-P1-001
  - API-CAL-001
source_symbols:
  - ac_generate_master_bias
  - ac_generate_master_dark
  - ac_generate_master_flat
  - ac_calibrate_frame
  - ac_correct_frame
  - ac_generate_master_bias_f64
  - ac_generate_master_dark_f64
  - ac_generate_master_flat_f64
  - ac_calibrate_frame_f64
  - ac_correct_frame_f64
  - ac_set_num_threads
  - ac_version
test_ids:
  - TEST-CAL-DESIGN-001
threading_model: host_executor_lease
resource_class: cpu_heavy
cpu_providers: [baseline]
determinism: fixed_reduction_order
