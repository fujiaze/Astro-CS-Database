notes: >-
  DISP-STAR-001..005 全部登记（STAR_DETECTION_ALGORITHMS §11.3，登记不改码）：
  001 FP32 通道 uint16 量化（orchestrator.cpp:2179-2187 float clamp [0,65535] 转
  uint16 后进 sdet_detect_ex；FP64 通道 sdet_detect_ex_f64 全程 double 不降级，
  PREC-105 同族）；002 全局单阈值 median+5·bgnoise 无局部背景自适应（sdet_api.cpp
  :1645，旧结构图局部背景路径仅存 sdet_detect:992-1274/debug:1281-1593）；
  003 SDetParams 9 字段生产消费面缺口（fitRadius 仅驱动 auto 半径日志推导
  :2024-2026，fwhmClipSigma 仅 debug :1450-1452，structureLayers 等 5 字段仅旧
  CC 路径消费）；004 饱和星 mag 量纲不一致（振幅 :2175 vs box 流量 :2177-2198）
  且 has_saturated 恒等于 is_saturated（:2203）；005 双实现并存（生产 peaker
  impl vs 旧 CC 结构图路径，候选过滤与去重语义漂移）。
  另登记：ThreadBudget 未接线（OpenMP 三处无 num_threads 注入）、无取消检查点
  （长帧检测不可中断）——整改归 P1-STAR-IMPL/INT。
  错误/状态码语义（P1-STAR-DOC 冻结，ALG-STARDET-001 §11.2）：入口 rc 0=成功
  （含 0 星空场，输出指针全 NULL，:2252-2263）、-1=参数无效/handle NULL/malloc
  失败（:1612、:2264-2270）；拟合级 SDET_FIT_OK/INVALID_PARAMS/NO_CONVERGENCE
  （:260-262/:425-429/:597-609，非 OK 候选丢弃 :2139 不出 NaN 行）；质量门
  reject_star SfError 五码（:177-186，饱和豁免 RMSE :203-206）；编排级
  STAR_DETECT_FAILED（orchestrator.cpp:2200-2212）、star_det 写块失败→阶段失败
  （:2242-2247）。释放纪律：十数组必经 sdet_free_detect_ex 整组释放（:2357-2373）。
  饱和/简并（科学专项）：饱和判定=3×3 邻域双条件（meanhigh-bg>=0.7·dynrange 且
  pixel0-minhigh<=0.1·dynrange，:1768-1773）；饱和中心=edge-walking（:1784-1812）；
  边界 2px 内允许丢弃（:1758-1760）；饱和+正常星 d^2<4.0 丢正常星保饱和星
  （:841-863）；输出全序=mag 升序 stable_sort+NaN 末尾（:941-956）+ maxStars
  截断保最亮（:2240-2242）。star_det v1 [N,6] 权威块列 [0..5]=x,y,flux,mag,
  saturated,has_saturated（orchestrator.cpp:2218-2246）；编排一帧一次权威检测
  （API-P1-003），PLATESOLVE 禁重检测（:1748-1755）。
  禁止声明 IMPLEMENTED（迁移落码未发生）。
