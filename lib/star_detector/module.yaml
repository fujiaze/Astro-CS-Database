# AstroCS phase1 star-detection module — 元数据 (P1-STAR-DOC 冻结, 2026-09-07)
# 状态: CONTRACT_READY —— 实现存在（生产源 lib/star_detector/src/sdet_api.cpp 的
# sdet_detect_impl/peaker 七步候选/sdet_moffat4_fit/sdet_lm_fit(GSL TR-LM)/
# reject_star/sdet_dedup_stars/sdet_sort_stars + C API sdet_create/sdet_destroy/
# sdet_detect/sdet_free_coords/sdet_detect_debug/sdet_free_debug_maps/
# sdet_detect_ex/sdet_detect_ex_f64/sdet_free_detect_ex，唯一权威签名头
# lib/star_detector/include/star_detector.h:1-73），模块化迁移（独立模块源
# astrocs_p1_star_detection.dll / C ABI adapter / plan-execute-cancel-inspect /
# ThreadLease 接线）由 P1-STAR-IMPL 执行；可执行测试由 P1-STAR-TEST 建立
# （TEST-STAR-DESIGN-001 → TEST-P1-STAR-001）。
# 字段遵循 11_MODULE_SOURCE_TEST_STANDARD.md §4；source_symbols 为源码核对清单
# （P1-STAR-DOC，2026-09-07，9 个导出 C API + 静态核心 sdet_detect_impl/
# sdet_moffat4_fit/sdet_lm_fit/reject_star，均 grep 实测于 sdet_api.cpp），
# 禁止手抄他版。
# 落位依据：MODULE_MIGRATION_MATRIX.csv P1-STAR 行 owner=SA-P1-S15、
# target=astrocs_p1_star_detection.dll、module_id=astrocs.p1.star_detection、
# legacy_paths="lib/star_detector;lib/phase1/stars"、depends_on_int=
# "IO-003;DATA-004;RT-006"、科学专项=subpixel centroid;completeness/false
# positive synthetic fields;saturation/blend/edge;deterministic ordering。
# dll_target=astrocs_p1_star_detection.dll 为迁移目标合同值（尚未存在）。现状
# 构建=lib/star_detector/Makefile:39（g++ -shared -fopenmp -O3 -march=native →
# star_detector.dll）+ lib/orchestrator/cpp/src/orchestrator.cpp:1539-1549
# （lib/star_detector/star_detector.dll 显式加载，失败即错）；根 CMakeLists.txt:441
# 另有 astrocs_phase1_stars STATIC（lib/phase1/stars P1-003 桥接层，独立
# sigma-clip 实现，与生产 sdet_api.cpp 非同一算法路径）——整合与 dll 重命名归
# P1-STAR-IMPL。
# threading_model=host_executor_lease 为迁移目标合同值（11 号标准 §4 值域）；
# 现状实现为 OpenMP 三处（sdet_api.cpp:448 行差分 static、:2321-2325 入口转换、
# :2042-2044 候选拟合 dynamic + reduction(+:fit_ok_count)，逐候选独立按索引写回，
# dedup/sort/maxStars 截断串行 :2224-2242，输出 bitwise 与线程数无关），无取消
# 检查点，ThreadBudget 接线为迁移整改点（见 docs/contracts/PUBLIC_API.md
# API-STAR-001 与 docs/algorithms/STAR_DETECTION_ALGORITHMS.md §11.3
# DISP-STAR-001..005）。
# entrypoint=MISSING：registry 入口未接；descriptor 现状占位 ID（lib/core/src/
# module_adapters.cpp:430-448 p1_star_psf_descriptor：module_id=
# astrocs.phase1.star-psf、sci_id=SCI-P1-PSF-001、alg_id=ALG-002、
# data_id=DATA-P1-SOURCES、api_id=API-P1-003、test_id=TEST-P1-PSF-001、
# ports cleaned/sources/psf）为编排层词汇，由 P1-PSF-INT/P1-STAR-INT 对齐本
# manifest 与 lib/star_detector/README.md（r1），不得反向作为冻结依据。
