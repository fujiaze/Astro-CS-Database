# AstroCS phase1 HiPS writer 模块 — 元数据 (P1-HIPS-DOC 冻结, 2026-09-07)
# 状态: CONTRACT_READY —— 实现存在（生产源 lib/astro_image_io/src/hips/
# aio_hips_writer.cpp，编译进根 CMakeLists.txt:298-309 静态库 astrocs_hips；
# C ABI 导出 aio_hips.h 9 符号）。模块化迁移已交付（P1-HIPS-IMPL, 2026-09-09）：
# 独立模块 DLL astrocs_p1_hips_writer（lib/hips/，SHARED 目标 PIC 重编译生产
# 闭包 2 TU + cfitsio 源）、C ABI v1 九操作 adapter（src/module_entry.cpp，
# entrypoint astrocs_module_query_v1，唯一导出 ABI-006；plan 真实 work_units /
# host_executor_lease 硬租约 detail 105 / entry cancel DISP-HIPS-001 事务化
# abort），见 lib/hips/CMakeLists.txt 与 src/module_entry.cpp。可执行测试由
# P1-HIPS-TEST 建立（TEST-HIPS-DESIGN-001 → TEST-P1-HIPS-001），adapter 契约
# 测试 hips_writer_adapter 由 P1-HIPS-IMPL 交付（tests/unit/p1_hips/）。
# 字段遵循 11_MODULE_SOURCE_TEST_STANDARD.md §4；source_symbols 为源码核对清单
# （P1-HIPS-DOC，2026-09-07，逐符号在 lib/astro_image_io/include/aio_hips.h
# 亲核可见），禁止手抄他版。
# 落位依据：MODULE_MIGRATION_MATRIX.csv P1-HIPS 行 target=astrocs_p1_hips_writer.dll、
# module_id=astrocs.p1.hips_writer，legacy_paths="lib/healpix_db;lib/phase1_session"
# —— 实测生产 HiPS writer 实现在 lib/astro_image_io/src/hips/aio_hips_writer.cpp
# （矩阵 legacy 路径中 lib/healpix_db 侧的写通道为 drizzle 侧 sink
# lib/healpix_db/healpix_drizzle/astro_sphere_sink.cpp 与 archive/legacy/healpix_stack
# 历史实现；lib/phase1_session 对 HiPS 零引用，grep 退出码 1），与 lib/drizzle/、
# lib/cosmetic/、lib/calibration/ 先例同构，本目录 lib/hips/ 为迁移目标目录、
# 不与 legacy 目录重叠、不含源码。
# threading_model=host_executor_lease 为迁移目标合同值（11 号标准 §4 值域）；
# 现状实现为单句柄串行写（无内部并行：write_* 逐 tile 顺序调用，CFITSIO 单
# 流程写盘，finalize 层次聚合按 k 降序确定性顺序），last_error 线程局部
# （aio_hips_writer.cpp:48 thread_local）。ThreadLease 接线为迁移整改点
# （见 docs/contracts/PUBLIC_API.md API-HIPS-001 与 docs/algorithms/HIPS_WRITER.md
# DISP-HIPS-001..012；含 CFITSIO mutex 包装、abort 事务化、estsize/fov
# 真实估算等登记项）。
# entrypoint=astrocs_module_query_v1（P1-HIPS-IMPL 交付态；v1 op 面单事务
# write_product，registry descriptor 注册与 Phase DAG 接入归 P1-HIPS-INT）。
id: MOD-astrocs-phase1-hips-writer
module_id: astrocs.p1.hips_writer
module_version: 0.11.0-alpha.2
abi_version: 1
phase_scope: phase1
dll_name: astrocs_p1_hips_writer.dll
module_status: CONTRACT_READY
entrypoint: astrocs_module_query_v1
# node_operations 按 types.h op 词表登记 (每 (module_id, operation) 绑定同一
# 唯一 entry astrocs_module_query_v1; gaia/CAL/COS 先例)。单事务 op 与 legacy
# 生产链 (astro_sphere_sink.cpp:52-167 同构序列) 1:1；aio_hips_write（HISS
# 中转批量兼容通道）不进模块 op 面，九导出符号全量编译进 DLL 且 ABI 合同
# 不裁剪（导出面经 version-script/DEF 降 local，ABI-006）。
node_operations:
  - write_product
input_ports:
  - p1.stacked
output_ports:
  - p1.hips
science_contracts:
  - SCI-DRZ-001
algorithm_contracts:
  - ALG-HIPS-001
  - ALG-HIPS-002
  - ALG-HIPS-003
  - ALG-HIPS-004
  - ALG-HIPS-005
data_contracts:
  - DATA-P1-DRZ
  - DATA-P1-HIPS
api_contracts:
  - API-HIPS-001
source_symbols:
  - aio_hips_product_begin
  - aio_hips_write_signal_support_tile
  - aio_hips_write_variance_tile
  - aio_hips_write_snr_points
  - aio_hips_set_drizzle_provenance
  - aio_hips_finalize
  - aio_hips_abort
  - aio_hips_write
  - aio_hips_last_error
  # AIO-002 原子发布原语 (publish.h v1 模块内核合同; DLL 内部隐藏符号,
  # 唯一导出面仍为 astrocs_module_query_v1; 测试经 adapter_entry_impl 直链)
  - aio_publish_stage_create_v1
  - aio_publish_stage_discard_v1
  - aio_publish_tree_fsync_v1
  - aio_publish_promote_v1
test_ids:
  - TEST-HIPS-DESIGN-001
  # AIO-002: 原子发布与临时目录清理 (ctest: hips_publish_atomic_units /
  # hips_publish_atomic; 测试源 tests/unit/p1_hips/publish_atomic_test.c)
  - TEST-P1-HIPS-PUBLISH-001
threading_model: host_executor_lease
resource_class: cpu_heavy
cpu_providers: [baseline]
determinism: fixed_reduction_order
