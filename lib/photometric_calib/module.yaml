# dll_target=astrocs_p1_photometry.dll 为迁移目标合同值（尚未存在）。现状
# 构建=lib/photometric_calib/cpp/Makefile:11（g++ -shared -fopenmp →
# photometric_calib.dll，链接 ../../gaia_xpsd_client/gaia_client.dll）+
# cpp/build.ps1:9（MinGW 通道）；未编入根 CMake 主构建（无 photometric_calib
# CMake 目标，与 astrocs_hips/astrocs_drizzle 先例不同）——CMake 集成归
# P1-PHOT-IMPL。生产调用=orchestrator.cpp:2474 run_stage_photometric →
# :2714 pc_calibrate_simple_with_gaia_f64_v2 / :2790 _v2（dll_loader.cpp:40/:54
# 加载名与路径吻合，gaia_client.dll 预加载 :271-281）。
# threading_model=host_executor_lease 为迁移目标合同值（11 号标准 §4 值域）；
# 现状实现为 OpenMP 逐星/逐元素独立并行（pc_api.cpp:931 F_syn
