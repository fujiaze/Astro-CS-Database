# AstroCS phase1 cosmetic module — 元数据 (P1-COS-DOC 冻结, 2026-09-07)
# 状态: CONTRACT_READY —— 实现存在（lib/calibration，CMake astrocs_calibration），
# 模块化迁移已由 P1-COS-IMPL 交付：astrocs_p1_cosmetic DLL（C ABI v1 九操作
# adapter，entrypoint astrocs_module_query_v1，唯一导出 ABI-006；plan-execute-
# cancel-inspect / host_executor_lease 租约接线见 lib/cosmetic/CMakeLists.txt
# 与 src/module_entry.cpp）。可执行测试由 P1-COS-TEST 建立（TEST-P1-COS-001）。
# 字段遵循 11_MODULE_SOURCE_TEST_STANDARD.md §4；source_symbols 为源码核对清单
# （P1-COS-DOC，2026-09-07，7 个生产符号），禁止手抄他版。
# threading_model=host_executor_lease 为迁移目标合同值（11 号标准 §4 值域）；
# adapter 经 host executor acquire/release 租约 + ac_set_num_threads 注入
# OMP ICV（不改生产源；见 docs/contracts/PUBLIC_API.md API-COS-001 与
# COSMETIC_ALGORITHMS.md §7/§10）。
id: MOD-astrocs-phase1-cosmetic
module_id: astrocs.p1.cosmetic
module_version: 0.11.0-alpha.2
abi_version: 1
phase_scope: phase1
dll_name: astrocs_p1_cosmetic.dll
module_status: CONTRACT_READY
entrypoint: astrocs_module_query_v1
# node_operations 按 types.h op 词表登记 (每 (module_id, operation) 绑定同一
# 唯一 entry astrocs_module_query_v1; gaia/CAL INT 先例)。2 科学 op 与
# cosmetic 域 legacy AC_API 科学导出 1:1 (ac_set_num_threads 为工具通道
# 不进 op 面); 线程改经 host_executor_lease 租约注入 (ac_set_num_threads
# 仅作注入途径; DISP-COS-008 整改点)。
node_operations:
  - correct_frame
  - correct_frame_f64
input_ports:
  - p1.calibrated
output_ports:
  - p1.cleaned
science_contracts:
  - SCI-CAL-001
algorithm_contracts:
  - ALG-COS-001
  - ALG-COS-002
  - ALG-COS-003
  - ALG-COS-004
  - ALG-COS-005
data_contracts:
  - DATA-P1-CAL
  - DATA-P1-COS
api_contracts:
  - API-P1-002
  - API-COS-001
source_symbols:
  - ac_correct_frame
  - ac_correct_frame_f64
  - detect_hot_pixels
  - detect_cold_pixels
  - filter_by_structure_size
  - interpolate_pixels
  - correct_frame
test_ids:
  - TEST-COS-DESIGN-001
threading_model: host_executor_lease
resource_class: cpu_heavy
cpu_providers: [baseline]
determinism: fixed_reduction_order
