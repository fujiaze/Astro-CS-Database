notes: >-
  装配层合同（P1-SESSION-DOC 冻结，2026-09-07，SA-P1-R19）：SCI/ALG 置空
  （science_contracts=[]；contract_ids.sci/alg=MISSING）——assembly 不定义
  科学与算法，科学权威=SCI-CAL-001（docs/science/CALIBRATION.md）+
  ALG-CAL-001..006 / ALG-COS-001..005（algorithm_contracts 仅引用既有
  冻结 ALG，不新设装配算法；INDEX.yaml 无 ALG-P1-SESSION 条目，决策见
  控制报告）。四段编排与 manifest/artifact schema 权威=DATA_SEMANTICS §16
  （DATA-P1-SESSION）；入口符号/时序/并发合同权威=PUBLIC_API.md
  API-P1-SESSION；编排级上游合同=API-P1-001（docs/api/PHASE1_API_V1.md，
  FROZEN）。
  如实差距（登记不改码）：API-P1-001 §1 冻结序列为校准→检测/PSF→plate
  solve→测光→SNR→Drizzle→HiPS 7-stage，现行 run 仅落 CAL+COS 4 段；
  star-psf/wcs/photometry/noise-snr/drizzle/writer 六 descriptor 的工厂
  委托 P1Api 仅提供 registry 注册与兼容 adapter 通道，p1_session 内无对应
  执行段（lib/core/src/module_adapters.cpp:755-770 p1_more[] 注册循环）；
  A 线 CLI 生产 7-stage 全链=production_call_paths_stage1.csv（DLL 显式
  加载，与本静态库并存，无第二调度顺序）。补齐归后续 P1-SESSION-IMPL/INT。
  已知限制：cosmetic master 实参 nullptr→检测禁用恒等 pass（:295-296，
  DISP-COS-009，整改归 P1-COS-INT）；dark_scale_factor 键 validate 不验、
  run value() 兜底 1.0（:225）；async_io_depth∈{0,1,2} 强校验（:152）但
  预读 worker 未按 depth 启用（PHASE1_API_V1 §1 预留语义）；校准输出仅
  FITS（aio_write_fits :262），XISF 仅读侧探测（aio_read :71-74）。
  禁止声明 IMPLEMENTED 于未验证证据处；本 manifest 由 P1-SESSION-DOC
  自包含自检（run/local/agent_p1_session_doc/selfcheck.py）复核。
