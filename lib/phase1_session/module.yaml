# AstroCS phase1_session module — 元数据 (P1-SESSION-DOC 冻结, 2026-09-07)
# 状态: CONTRACT_READY —— assembly 层：p1_session 函数族是 Phase1 进程内
# 装配会话的唯一实现（lib/phase1_session/p1_session.cpp:90-371，五导出 C API
# + astrocs::phase1::last_error，唯一权威签名头 lib/phase1_session/p1_session.h）。
# 只描述装配：四段 io_read→calibrate→cosmetic→io_write（p1_session.cpp:168/
# 195/283/319），科学实现全部委托既有冻结 C API（ac_calibrate_frame :243 /
# ac_correct_frame :294，见 lib/calibration；算法权威 docs/algorithms/
# CALIBRATION_ALGORITHMS.md 与 COSMETIC_ALGORITHMS.md），本层无算法公式。
# 字段遵循 11_MODULE_SOURCE_TEST_STANDARD.md §4；source_symbols 逐符号
# grep 实测于 p1_session.cpp（P1-SESSION-DOC, 2026-09-07），禁止手抄他版。
# registry 关系（lib/core/src/module_adapters.cpp 实测）：无独立
# astrocs.phase1.session descriptor；p1_session 五函数经 P1Api（:693-700）
# 被 8 个 Phase1 descriptor 工厂委托——astrocs.phase1.calibration（:254，
# :728-735 注册）+ p1_more[] 7 子模块（:755-770）。descriptor 占位词汇
# （ALG-002/ALG-004/ALG-005、TEST-P1-*-001）不作冻结依据（P1-PSF-DOC 先例）。
# 构建=根 CMakeLists.txt:448-452（STATIC 库 astrocs_phase1_session，链接
# astrocs_contracts/astrocs_calibration/astrocs_aio）+ :496/:514/:530 编入
# astrocs 主可执行。MODULE_MIGRATION_MATRIX 无 P1-SESSION 行：assembly 层
# 不设独立 DLL 迁移目标 → dll_name=MISSING（11 号标准：未知/不适用显式
# MISSING，禁止空串）。
# entrypoint=p1_session_run：真实导出符号（p1_session.cpp:149 定义，
# p1_session.h:23 声明；验收口径=登记符号可见，符号存在性由 selfcheck 与
# tools/check_p1_symbol_map.py 复核）。
# threading_model=host_executor_lease：B 线 registry 通道经 SessionModule
# ThreadLease 租借（module_adapters.cpp:156-162）+ ac_set_num_threads(
# budget.max_workers) 注入（p1_session.cpp:162-165，迁移整改点，禁硬编码
# 核数）；p1_session 自身 threadsafe:no（handle 级，p1_session.h:15）。
schema: astrocs.module-manifest/v1
