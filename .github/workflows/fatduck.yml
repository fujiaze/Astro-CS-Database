name: AstroCS Fatduck Validation

# V8-CI-008（owner=SA-CI-32）。真实数据校验 workflow（Fatduck）。
# 触发仅两种：Windows CI 成功（workflow_run）与每 6 小时 schedule；
# 不开放手动触发（负向测试 V8-CI-009 注入手动触发器必须被拒绝）。
# workflow_run 定义只会在默认分支生效；select-candidate 内仍显式校验
# head_branch == main 且 conclusion == success（双重防线，ci/select_candidate.py）。
# Fatduck 边界（toolchain.policy.json fatduck 节）：build_source=
# github_windows_candidate_only、compile_allowed=false、checkout_allowed=false。

on:
  workflow_run:
    workflows: ["AstroCS Windows CI"]
    types: [completed]
    branches: [main]
  schedule:
    # 每 6 小时刷新最新合格候选（工程控制 09：定时 workflow 每 6 小时）。
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  # 只保留最新 pending，不取消 running（cancel-in-progress: false）。
  group: fatduck-${{ github.event.workflow_run.head_sha || 'schedule' }}
  cancel-in-progress: false

jobs:
  select-candidate:
    name: Select Fatduck candidate (GitHub-hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_candidate: ${{ steps.gate.outputs.proceed }}
      source_sha: ${{ steps.sel.outputs.source_sha }}
      windows_run_id: ${{ steps.sel.outputs.windows_run_id }}
      artifact_name: ${{ steps.sel.outputs.artifact_name }}
      no_candidate_reason: ${{ steps.sel.outputs.no_candidate_reason }}
    steps:
      - name: Checkout exact SHA (hosted job only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (ci/actions.lock.json)
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select candidate via GitHub API
        id: sel
        env:
          # hosted 自动注入的默认 token（仓库级只读），仅用于 API 查询。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          python3 ci/select_candidate.py \
            --event "$GITHUB_EVENT_NAME" \
            --head-branch "${{ github.event.workflow_run.head_branch }}" \
            --conclusion "${{ github.event.workflow_run.conclusion }}" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --json \
            --log "$PWD/artifacts/select_candidate_log.jsonl"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 3 ]; then
            echo "::notice::no-candidate：本轮无合格候选（结构化原因见 no_candidate_reason 输出）"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
      - name: Resolve selection gate
        id: gate
        if: always()
        run: |
          if [ "${{ steps.sel.outputs.rc }}" = "0" ] && \
             [ "${{ steps.sel.outputs.has_candidate }}" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload selection log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (ci/actions.lock.json)
        with:
          name: fatduck-select-log-${{ github.run_id }}
          path: artifacts/select_candidate_log.jsonl
          retention-days: 14
          if-no-files-found: error

  fatduck-validate:
    name: Fatduck real-data validation (self-hosted)
    needs: [select-candidate]
    # 无合格候选 -> 本 job skipped（skip 下游语义，见 TASK_RESULT）。
    if: needs.select-candidate.outputs.has_candidate == 'true'
    runs-on: [self-hosted, fatduck-realdata]
    # 32R 正式分段验证窗口上限对齐控制包模板（V8-FAT-002 全天窗）。
    timeout-minutes: 1440
    permissions:
      contents: read
    steps:
      # 本 job 无 repo 检出、无安装、无任何仓库内脚本；只允许
      # download-artifact（锁定 SHA、指定 run-id）-> 固定本地 harness 入口
      # -> upload-artifact（固定 publish 白名单目录）。任何失败 fail 全 job。
      - name: Download candidate artifact from triggering CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (ci/actions.lock.json)
        with:
          name: ${{ needs.select-candidate.outputs.artifact_name }}
          run-id: ${{ needs.select-candidate.outputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: 'D:\AstroCSRunner\runs\incoming'
      - name: Download CI evidence artifact from triggering CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (ci/actions.lock.json)
        with:
          name: windows-ci-${{ needs.select-candidate.outputs.source_sha }}
          run-id: ${{ needs.select-candidate.outputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: 'D:\AstroCSRunner\runs\incoming\ci-evidence'
      - name: Run fixed local validation harness
        shell: pwsh
        run: >
          & 'D:\AstroCSRunner\harness\run_validation.ps1'
          -CandidateZip 'D:\AstroCSRunner\runs\incoming\AstroCS-candidate.zip'
          -SourceSha '${{ needs.select-candidate.outputs.source_sha }}'
          -ResultDir 'D:\AstroCSRunner\runs\publish\${{ needs.select-candidate.outputs.source_sha }}'
      - name: Upload public validation results (publish whitelist dir only)
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (ci/actions.lock.json)
        with:
          name: fatduck-public-${{ needs.select-candidate.outputs.source_sha }}
          path: 'D:\AstroCSRunner\runs\publish\${{ needs.select-candidate.outputs.source_sha }}\public'
          retention-days: 14
          if-no-files-found: error

  notify-owner:
    name: Notify owner on single review issue
    needs: [select-candidate, fatduck-validate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download public validation results
        if: needs.fatduck-validate.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (ci/actions.lock.json)
        with:
          name: fatduck-public-${{ needs.select-candidate.outputs.source_sha }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: public-results
      - name: Append result to owner review issue
        if: needs.fatduck-validate.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REVIEW_ISSUE: ${{ vars.ASTROCS_OWNER_REVIEW_ISSUE }}
          SOURCE_SHA: ${{ needs.select-candidate.outputs.source_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue="${OWNER_REVIEW_ISSUE:-}"
          if [ -z "$issue" ]; then
            echo "notify=skipped_missing_issue_variable"
            echo "::notice::ASTROCS_OWNER_REVIEW_ISSUE 未设置 -> 结构化跳过（不评论，防伪造）"
            exit 0
          fi
          case "$issue" in
            *[!0-9]*)
              echo "notify=skipped_invalid_issue_variable"
              echo "::notice::ASTROCS_OWNER_REVIEW_ISSUE 非纯数字 -> 结构化跳过（不评论）"
              exit 0;;
          esac
          summary_text="(public summary JSON not present in artifact)"
          if [ -f public-results/FATDUCK_PUBLIC_SUMMARY.json ]; then
            summary_text="$(head -c 2000 public-results/FATDUCK_PUBLIC_SUMMARY.json)"
          fi
          body="$(printf '%s\n' \
            "AstroCS Fatduck 真实数据校验通过（自动通知）。" \
            "" \
            "- source SHA: \`$SOURCE_SHA\`" \
            "- 公开结果 artifact（含 JPG，名称 \`fatduck-public-$SOURCE_SHA\`）: $RUN_URL#artifacts" \
            "- 本地打开命令: \`astrocs-cli review open --run $SOURCE_SHA\`" \
            "" \
            "- 指标摘要（截断）: $summary_text")"
          # 单一固定 Issue 追加评论；绝不新建 Issue（V8-FAT-003 边界）。
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/$issue/comments" \
            -f body="$body"
          echo "notify=commented issue=$issue"
