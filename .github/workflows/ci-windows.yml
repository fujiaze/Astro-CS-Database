name: AstroCS Windows CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (ci/actions.lock.json)
        with:
          persist-credentials: false
          fetch-depth: 1
      # WIN-001 hosted 化：runner 预装 vcpkg 提供 MSVC zlib（cfitsio zcompress.c
      # 依赖，ACS_ZLIB_ROOT 消费点；triplet x64-windows-static-md 对齐 /MD CRT）。
      # PyYAML：CONTRACT-GRAPH / DOC-INDEX 的 yaml 解析依赖（agent-host 有而
      # hosted runner 无的验证侧依赖，不属业务安装面）。
      - name: Provide zlib (vcpkg) and PyYAML
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT"
          & "$vcpkg\vcpkg.exe" install zlib --triplet x64-windows-static-md
          "ACS_ZLIB_ROOT=$vcpkg\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python -m pip install --quiet PyYAML
      - name: Bootstrap locked toolchain
        run: python ci/bootstrap.py --policy ci/toolchain.policy.json --platform windows
      - name: Run MSVC tests and package candidate
        run: python ci/run.py --profile windows-main
      - name: Validate candidate
        run: python ci/validate_candidate.py artifacts/candidate/AstroCS-candidate.zip
      - name: Upload candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (ci/actions.lock.json)
        with:
          name: astrocs-windows-candidate-${{ github.sha }}
          path: artifacts/candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Collect bootstrap diagnostics
        if: failure()
        shell: pwsh
        run: |
          @'
          import json, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path
          diag = {
              "schema_version": 1,
              "purpose": "bootstrap diagnostics collected after a failed step (does not mask the primary cause)",
              "generated_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "bootstrap_exit_code": None,
              "report": None,
              "stderr_fail_payload": None,
          }
          try:
              res = subprocess.run(
                  [sys.executable, "ci/bootstrap.py",
                   "--policy", "ci/toolchain.policy.json", "--platform", "windows", "--json"],
                  capture_output=True, text=True, timeout=120,
                  encoding="utf-8", errors="replace")
              diag["bootstrap_exit_code"] = res.returncode
              if res.stdout.strip():
                  try:
                      diag["report"] = json.loads(res.stdout)
                  except json.JSONDecodeError:
                      pass
              for line in reversed((res.stderr or "").strip().splitlines()):
                  try:
                      cand = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(cand, dict) and cand.get("verdict") == "FAIL":
                      diag["stderr_fail_payload"] = cand
                      break
          except Exception as exc:  # noqa: BLE001
              diag["collection_error"] = repr(exc)
          Path("artifacts/ci").mkdir(parents=True, exist_ok=True)
          (Path("artifacts/ci") / "BOOTSTRAP_DIAG.json").write_text(
              json.dumps(diag, ensure_ascii=False, indent=2), encoding="utf-8")
          print("BOOTSTRAP_DIAG.json written (bootstrap_exit_code=%s)"
                % diag["bootstrap_exit_code"])
          '@ | python -
      - name: Upload public CI evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (ci/actions.lock.json)
        with:
          name: windows-ci-${{ github.sha }}
          # F-R3-02: cmake 真实错误落 run/ci/win-build-summary.json，一并上传；
          # 多路径模式下某路径缺失仅 warning，artifacts/ci/ 有内容即满足
          # if-no-files-found: error（不再因单一路径为空而丢弃全部证据）。
          # F-R4-02: 追加 ctest junit 与 driver test 汇总，ctest 失败用例名
          # 可离线定位（路径 = checks.json WIN-TEST-UNIT outputs 契约）。
          path: |
            artifacts/ci/
            run/ci/win-build-summary.json
            run/ci/win-test-junit.xml
            run/ci/win-test-summary.json
          retention-days: 14
          if-no-files-found: error
