name: AstroCS Windows CI

# CI-001B｜workflow ↔ 注册表联动核死：
# - 本文件 run: 体只允许三类调用：ci/run.py（执行 ci/checks.json 注册检查）、
#   ci/wf_step.py（派发 ci/workflow_binding.json 声明步）、ci/bootstrap.py
#   （锁定工具链 CI 入口）；其余步只能是 host-provisioning / artifact-upload。
# - 绑定声明：ci/workflow_binding.json（每步唯一一条，双向漂移即 FAIL）；
# - 静态核死：python3 ci/validate_workflow_binding.py；
# - actions 全部锁 ci/actions.lock.json 完整 SHA（复验：ci/verify_actions_lock.py）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # CI-001B：group 必须同时含 ref 与 event_name（见 ci/validate_workflow_binding.py B14）——
  # 否则手动触发（G-CI 验收/手动双虚拟机核验）与 push run 同组，会被后继 push
  # 在 pending 态取代（cancelled）而永远拿不到该 SHA 的 Windows 验证。
  # 与 ci-linux.yml 同款口径；cancel-in-progress 维持 false（不取消进行中的验证）。
  group: windows-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (ci/actions.lock.json)
        with:
          persist-credentials: false
          # HOSTFIX-23①: 默认 fetch-depth: 1 是浅克隆, REMOTE_RELATION 的
          # git merge-base --is-ancestor <旧SHA> HEAD 解析祖先对象 rc=128;
          # 全历史克隆后该检查与 WORKSPACE-ADOPTION 均可解析 HEAD 祖先链。
          fetch-depth: 0
      # WIN-001 hosted 化：runner 预装 vcpkg 提供 MSVC zlib（cfitsio zcompress.c
      # 依赖，ACS_ZLIB_ROOT 消费点；triplet x64-windows-static-md 对齐 /MD CRT）。
      # PyYAML：CONTRACT-GRAPH / DOC-INDEX 的 yaml 解析依赖（agent-host 有而
      # hosted runner 无的验证侧依赖，不属业务安装面）。
      - name: Provide zlib (vcpkg) and PyYAML
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT"
          & "$vcpkg\vcpkg.exe" install zlib --triplet x64-windows-static-md
          "ACS_ZLIB_ROOT=$vcpkg\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # HOSTFIX-23④: 确定性注入 zlib 静态库名（上游 madler/zlib v1.3.2
          # WIN32 静态产物为 zs.lib，find_library 的 z/libz/zlib 均未命中）。
          # 列出 triplet lib 下首个 zlib 家族 *.lib 文件全名写入 GITHUB_ENV，
          # CMake 端 $ENV{ACS_ZLIB_LIB} 直连，find_library 降级为回退探测。
          $zlibLib = Get-ChildItem -Path "$vcpkg\installed\x64-windows-static-md\lib" -Filter *.lib |
            Where-Object { $_.Name -match '^(lib)?z(s|static)?\.lib$|^(lib)?zlib(static|d)?\.lib$' } |
            Sort-Object Name | Select-Object -First 1
          if ($zlibLib) {
            "ACS_ZLIB_LIB=$($zlibLib.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "ACS_ZLIB_LIB resolved: $($zlibLib.FullName)"
          } else {
            Write-Host "::warning::no zlib *.lib under $vcpkg\installed\x64-windows-static-md\lib (find_library fallback will try)"
          }
          python -m pip install --quiet PyYAML
          # WIN-PACKAGE-CANDIDATE prerequisite_tools 含 dumpbin（verify_candidate
          # 的 exported_abi / DLL 加载二进制级校验）。hosted runner 的 VS 自带
          # dumpbin.exe 但不在 PATH → CI-001 收紧后 WIN-PACKAGE-CANDIDATE 不可
          # waiver：prerequisite FAIL(prerequisite) → ci/run.py exit 1 → 本 job
          # 失败（不再静默跳过）。按 MSVC 工具链固定布局注入 PATH（版本目录
          # 通配，不硬编码版本号）。
          $dumpbinDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64" -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'dumpbin.exe') } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($dumpbinDir) {
            $dumpbinDir.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "dumpbin PATH injected: $($dumpbinDir.FullName)"
          } else {
            Write-Host "::warning::dumpbin.exe not found under VS 2022 MSVC toolchain (WIN-PACKAGE-CANDIDATE will FAIL prerequisite - CI-001 fail-closed)"
          }
      - name: Bootstrap locked toolchain
        run: python ci/bootstrap.py --policy ci/toolchain.policy.json --platform windows
      - name: Run MSVC tests and package candidate
        run: python ci/run.py --profile windows-main
      - name: Upload candidate
        # CI-001B：显式声明 if（默认 success()），使上传面在绑定声明里逐条可审计。
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (ci/actions.lock.json)
        with:
          name: astrocs-windows-candidate-${{ github.sha }}
          path: artifacts/candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Collect bootstrap diagnostics
        if: failure()
        shell: pwsh
        run: |
          # CI-001B 目标 1：内联诊断体迁入 ci/steps/collect_bootstrap_diag.py（两平台共用）。
          python ci/wf_step.py --step WINDOWS-BOOTSTRAP-DIAG
      - name: Upload public CI evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (ci/actions.lock.json)
        with:
          name: windows-ci-${{ github.sha }}
          # F-R3-02: cmake 真实错误落 run/ci/win-build-summary.json，一并上传；
          # 多路径模式下某路径缺失仅 warning，artifacts/ci/ 有内容即满足
          # if-no-files-found: error（不再因单一路径为空而丢弃全部证据）。
          # F-R4-02: 追加 ctest junit 与 driver test 汇总，ctest 失败用例名
          # 可离线定位（路径 = checks.json WIN-TEST-UNIT outputs 契约）。
          path: |
            artifacts/ci/
            run/ci/win-build-summary.json
            run/ci/win-test-junit.xml
            run/ci/win-test-summary.json
            # WIN-PACKAGE-CANDIDATE outputs 契约: package 失败(exit 5)时
            # win-package-summary.json 是唯一含 failed_verification 逐项
            # 明细的证据, 缺它无法离线定位哪一项 verify 挂掉。
            run/ci/win-package-summary.json
            run/ci/monitor/WIN-PACKAGE-CANDIDATE.json
            # package exit 5 时 candidate 树本体 = DLL/EXE 实物, 离线可跑
            # dumpbin 复核 exported_abi 与 modules/selftest 行为。
            run/ci/win-candidate/
            # F-R4-03: driver 逐阶段全量 tee 日志 (win-stage-<name>.log)。
            # build exit 1 时 output_tail 25 行可能只见成功链接行, 真实 error
            # 被冲出窗口; 全量日志保证下一轮可直接定位 (e.g. astrocs_io
            # C1189 / io_reentrant_test LNK1104 均由 error_lines 才见)。
            run/ci/win-stage-*.log
          retention-days: 14
          if-no-files-found: error
