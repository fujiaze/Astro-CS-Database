name: AstroCS Linux CI

# CI-001B｜workflow ↔ 注册表联动核死：
# - 本文件 run: 体只允许三类调用：ci/run.py（执行 ci/checks.json 注册检查）、
#   ci/wf_step.py（派发 ci/workflow_binding.json 声明步）、ci/bootstrap.py 与
#   ci/select_profile.py（CI 入口）；其余步只能是 host-provisioning / artifact-upload
#   （纯外部工具安装，不含仓库路径与构建命令）。
# - 绑定声明：ci/workflow_binding.json（每步唯一一条，双向漂移即 FAIL）；
# - 静态核死：python3 ci/validate_workflow_binding.py；
# - actions 全部锁 ci/actions.lock.json 完整 SHA（复验：ci/verify_actions_lock.py）。
# - 手动触发（G-CI 核验）与 push 分属不同 concurrency 组（group 含 event_name），
#   手动 run 不会被后继 push 在 pending 态取代。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [linux-main, linux-deep]
        default: linux-main
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      # V8.1-CI：cmd_test_synthetic 的 unit 门二进制目录重定向
      # （默认 build/root-cmake/tests/unit 为 V6.1 布局，hosted 无此树）。
      # 仅被 astrocs test synthetic 读取；相对路径按进程 cwd=仓库根解析。
      ASTROCS_TEST_BIN_DIR: build/linux-control/tests/unit
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (ci/actions.lock.json)
        with:
          persist-credentials: false
          # HOSTFIX-23①: 默认 fetch-depth: 1 是浅克隆, REMOTE_RELATION 的
          # git merge-base --is-ancestor <旧SHA> HEAD 解析祖先对象 rc=128;
          # 全历史克隆后该检查与 WORKSPACE-ADOPTION 均可解析 HEAD 祖先链。
          fetch-depth: 0
      - name: Bootstrap locked toolchain
        run: python3 ci/bootstrap.py --policy ci/toolchain.policy.json --platform linux
      - name: Select profile
        id: profile
        shell: bash
        run: python3 ci/select_profile.py --event "$GITHUB_EVENT_NAME" --requested "${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
      - name: Install linux-main python deps (numpy for UT-IO)
        if: steps.profile.outputs.profile == 'linux-main'
        shell: bash
        run: |
          set -euo pipefail
          # HOSTFIX-23③：UT-IO（checks.json profiles=[linux-main]）三测试模块
          # fixture 依赖 numpy，此前唯一装 numpy 的步骤（Install deep coverage
          # tools）带 deep-only if，linux-main 跑 UT-IO 时
          # ModuleNotFoundError: No module named 'numpy' → 3 tests 0 ran。
          # tests/io 全量 imports 实读：第三方依赖仅 numpy（其余为 stdlib 与
          # 仓库本地模块 fits_verify/hips_output_store/make_hips_fixture）。
          # 仅装验证侧 fixture 依赖，不联网拉任何业务依赖；apt 双超时保护。
          # V8.1-CI（本批次）：追加 python3-astropy——tests/io/make_hips_fixture.py
          # Moc.fits 段是 try-import（缺 astropy 时静默不写 Moc.fits），UT-IO
          # 的 MOC 断言用例在 hosted 镜像缺 astropy 时必然 FAIL；
          # 追加 nlohmann-json3-dev——UT-BACKEND abi_loader/backend_loader.cpp
          # 系统头 `#include <nlohmann/json.hpp>`（third_party/nlohmann 仅根图
          # CMake include 路径，tests 自编译 g++ 直调不含该路径），hosted 镜像
          # 无此包 → 7 tests 编译 assert 失败。
          # V9-CI R9（sdet GSL）：追加 libgsl-dev——UT-BACKEND p1002/p2003/
          # phase3_reproject 三个 setUpClass 自编译 sdet_api.cpp 系统头
          # `#include <gsl/gsl_multifit_nlinear.h>`；libgsl-dev 此前只在
          # linux-deep 的 deep coverage tools 步骤安装，linux-main 的
          # UT-BACKEND 编译恒 fatal error → setUpClass ERROR ×3。
          timeout 240 sudo apt-get update -qq
          timeout 480 sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y -qq --no-install-recommends \
            python3-numpy python3-astropy nlohmann-json3-dev libgsl-dev
          python3 -c "import numpy, astropy; print('numpy ready:', numpy.__version__, '/ astropy ready:', astropy.__version__)"
          test -f /usr/include/nlohmann/json.hpp
          test -f /usr/include/gsl/gsl_multifit_nlinear.h
      - name: Install deep coverage tools
        if: steps.profile.outputs.profile == 'linux-deep'
        shell: bash
        run: |
          set -euo pipefail
          # V8-CI-012 F-D3：hosted 镜像（本批次）缺 llvm-profdata/llvm-cov/pytest，
          # DEEP-COV-* 双检查 prerequisite 探测失败 → waivable 跳过，coverage 基线缺位。
          # 工具清单实读依据：DEEP-COV-CPP = cmake + llvm-profdata + llvm-cov
          # （CMakeLists.txt ASTROCS_BUILD_COVERAGE find_program 硬依赖）；
          # DEEP-COV-PY = pytest（tools/quality/ci_coverage_runner.py 以 --cov 调用，
          # 需 pytest-cov 插件随装）。版本对齐 clang-18 时代包名（llvm-18）。
          # 仅安装验证工具，不联网拉任何业务依赖；apt 双超时保护，最小输出。
          # V8-CI-012 R7（numpy×6 ENV_FAIL + sdet GSL）：hosted 镜像缺
          # python3-numpy/astropy/scipy/yaml 与 libgsl-dev（runner-images
          # Ubuntu2404 apt 清单实读核对），验证侧 fixture 依赖（数值断言与
          # p1002 sdet 自编译），不属业务安装面。
          timeout 240 sudo apt-get update -qq
          timeout 480 sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y -qq --no-install-recommends \
            llvm-18 python3-pytest python3-pytest-cov \
            python3-numpy python3-astropy python3-scipy python3-yaml \
            libgsl-dev
          # llvm-18 无后缀可执行在 /usr/lib/llvm-18/bin，GITHUB_PATH 对后续步生效
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          # 本步内 PATH 尚未刷新，按落点直接核验；缺失时显式报错不静默
          test -x /usr/lib/llvm-18/bin/llvm-profdata
          test -x /usr/lib/llvm-18/bin/llvm-cov
          command -v pytest
          echo "deep coverage tools ready: pytest=$(command -v pytest), llvm-18 bin=/usr/lib/llvm-18/bin"
      - name: Run registered checks
        run: python3 ci/run.py --profile "${{ steps.profile.outputs.profile }}"
      - name: Collect bootstrap diagnostics
        if: failure()
        shell: bash
        run: |
          # CI-001B 目标 1：内联诊断体迁入 ci/steps/collect_bootstrap_diag.py（两平台共用）。
          # 仅失败路径调用，不掩盖首要失败原因。
          python3 ci/wf_step.py --step LINUX-BOOTSTRAP-DIAG
      - name: Upload small evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (ci/actions.lock.json)
        with:
          name: linux-ci-${{ github.sha }}
          path: artifacts/ci/
          retention-days: 14
          if-no-files-found: error
